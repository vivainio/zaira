[project]
name = "zaira"
version = "0.0.0.dev0"
description = "CLI tool for offline Jira ticket management. Export tickets to markdown, generate reports, and keep everything in sync."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["jira", "cli", "tickets", "export", "markdown", "reports", "atlassian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "jira>=3.5.0",
    "keyring>=24.0",
    "markdown>=3.5",
    "platformdirs>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/vivainio/zaira"
Repository = "https://github.com/vivainio/zaira"
Issues = "https://github.com/vivainio/zaira/issues"

[project.scripts]
zaira = "zaira.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ty>=0.0.60",
]

[tool.uv]
package = true
constraint-dependencies = [
    "cryptography>=48.0.1",
    "idna>=3.15",
    "urllib3>=2.7.0",
    "pygments>=2.20.0",
]

[tool.setuptools]
packages = ["zaira"]

[tool.setuptools.package-data]
zaira = ["skills/zaira/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires configured external services and may modify remote data",
]

[tool.ty.src]
include = ["zaira"]

[tool.ty.analysis]
allowed-unresolved-imports = ["toon_format"]
